# kro ResourceGraphDefinition: everything Bifrost needs around its Helm release.
# AWS side through ACK: the Postgres store on RDS (security group, subnet group,
# DB instance), the role Bifrost calls Bedrock with and its Pod Identity
# association. Kubernetes side: Bifrost's namespace, the ServiceAccount, a fixed
# in-namespace name for the database (Service bifrost-db), the pricing ConfigMap,
# Bifrost's network policy and the agent's copy of its key in the agent's
# namespace.
# The Bifrost Deployment itself comes from the official Helm chart (values.yaml);
# kro has no Helm resource, so apply.sh installs the chart once this instance is
# ACTIVE. The four Secrets stay made by apply.sh: their values must be secret, and
# kro's generators (`random.seededString`, `random.seededInt`) are deterministic
# from their seed, so a graph cannot make fresh random bytes; a secret value has to
# be made outside it (kro CEL libraries, https://github.com/kubernetes-sigs/kro/blob/main/website/docs/docs/concepts/expressions/02-cel-libraries.md).
#
# Cluster scoped: the instance has no namespace, since it is the thing that makes
# the namespace (as kro/base-rgd.yaml does for sra). Every namespaced child names
# the Namespace, so kro deletes them before it. scope cannot change once the RGD
# is live: an RGD applied before this change (namespaced) is deleted first.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: bifrost-backend
spec:
  schema:
    apiVersion: v1alpha1
    kind: BifrostBackend
    scope: Cluster
    spec:
      # Bifrost's namespace, made by this graph. It must be in bootstrap/'s
      # secret_namespaces, so the ACK rds controller may read the password there.
      namespace: string | default="bfx"
      # Names every AWS resource: <prefix>-bifrost. The default is inside
      # bootstrap/'s rds_prefix, which scopes the ACK role to these names.
      prefix: string | default="bfx"
      # The ManagedBy tag on every AWS resource made here, so a clean up can
      # tell this sample's resources from anyone else's; one bootstrap/ allows.
      managedBy: string | default="bfx"
      clusterName: string
      accountID: string
      region: string
      # The cluster's VPC, its CIDR (who may reach Postgres on 5432) and the
      # cluster's subnets, all of them, which the database's subnet group uses.
      vpcID: string
      vpcCIDR: string
      subnetIDs: "[]string"
      # The one inference profile Bifrost may call.
      modelID: string
      # The model behind that profile, without the geography prefix.
      foundationModelID: string
      # The namespace of the agent pods, the only callers allowed in.
      agentNamespace: string
      dbInstanceClass: string | default="db.t4g.micro"
      dbEngineVersion: string | default="17.11"
      dbAllocatedStorage: integer | default=20
      dbBackupRetentionDays: integer | default=1
      # RDS Multi-AZ keeps a standby in a second AZ, which bills the instance and
      # its storage twice (README, Why the state is in Postgres).
      dbMultiAZ: boolean | default=false
      # The two pricing files (bifrost/pricing/), as strings; apply.sh fills them.
      pricingJSON: string | required=true
      modelParametersJSON: string | required=true
    status:
      dbHost: ${db.status.endpoint.address}
  resources:
    # The namespace, created with the label in the same object so it never exists
    # unlabelled; apply.sh uses it only when it carries the label.
    - id: ns
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${schema.spec.namespace}
          labels:
            app.kubernetes.io/managed-by: ${schema.spec.managedBy}

    # The database password, made by apply.sh once the namespace is there. Read
    # only, never deleted by kro; db waits for it.
    - id: dbSecret
      externalRef:
        apiVersion: v1
        kind: Secret
        metadata:
          name: bifrost-db
          namespace: ${ns.metadata.name}

    - id: dbSecurityGroup
      template:
        apiVersion: ec2.services.k8s.aws/v1alpha1
        kind: SecurityGroup
        metadata:
          name: ${schema.spec.prefix}-bifrost-db
          namespace: ${ns.metadata.name}
        spec:
          name: ${schema.spec.prefix}-bifrost-db
          description: Postgres for Bifrost, from inside the cluster VPC only
          vpcID: ${schema.spec.vpcID}
          ingressRules:
            - ipProtocol: tcp
              fromPort: 5432
              toPort: 5432
              ipRanges:
                - cidrIP: ${schema.spec.vpcCIDR}
                  description: cluster VPC
          tags:
            - key: Name
              value: ${schema.spec.prefix}-bifrost-db
            - key: ManagedBy
              value: ${schema.spec.managedBy}

    - id: dbSubnetGroup
      template:
        apiVersion: rds.services.k8s.aws/v1alpha1
        kind: DBSubnetGroup
        metadata:
          name: ${schema.spec.prefix}-bifrost
          namespace: ${ns.metadata.name}
        spec:
          name: ${schema.spec.prefix}-bifrost
          description: Bifrost Postgres, the cluster's subnets
          subnetIDs: ${schema.spec.subnetIDs}
          tags:
            - key: ManagedBy
              value: ${schema.spec.managedBy}

    # Not public, encrypted, TLS forced (the postgres17 default parameter group
    # sets rds.force_ssl 1). The master password is the Secret bifrost-db that
    # apply.sh makes; Bifrost reads the same Secret.
    - id: db
      readyWhen:
        - ${db.status.dbInstanceStatus == "available"}
      template:
        apiVersion: rds.services.k8s.aws/v1alpha1
        kind: DBInstance
        metadata:
          name: ${schema.spec.prefix}-bifrost
          namespace: ${ns.metadata.name}
        spec:
          dbInstanceIdentifier: ${schema.spec.prefix}-bifrost
          dbInstanceClass: ${schema.spec.dbInstanceClass}
          engine: postgres
          engineVersion: ${schema.spec.dbEngineVersion}
          allocatedStorage: ${schema.spec.dbAllocatedStorage}
          storageType: gp3
          storageEncrypted: true
          multiAZ: ${schema.spec.dbMultiAZ}
          publiclyAccessible: false
          deletionProtection: false
          backupRetentionPeriod: ${schema.spec.dbBackupRetentionDays}
          dbName: bifrost
          masterUsername: bifrost
          masterUserPassword:
            namespace: ${dbSecret.metadata.namespace}
            name: ${dbSecret.metadata.name}
            key: password
          dbSubnetGroupName: ${dbSubnetGroup.spec.name}
          vpcSecurityGroupIDs:
            - ${dbSecurityGroup.status.id}
          tags:
            - key: ManagedBy
              value: ${schema.spec.managedBy}

    # The chart's values name the database by this fixed in-namespace host, so
    # the RDS endpoint never has to be written into the Helm values.
    - id: dbService
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: bifrost-db
          namespace: ${ns.metadata.name}
        spec:
          type: ExternalName
          externalName: ${db.status.endpoint.address}

    # Bifrost's own role: the one inference profile, and its foundation model in
    # the Regions the profile routes to, only when called through that profile
    # (the Bedrock User Guide's policy for geographic cross-Region inference).
    # Trusted only from this cluster, namespace and ServiceAccount: one role for
    # this one workload, through EKS Pod Identity (BPG latest/bpg/security/iam.adoc:1078-1081
    # "Use one IAM role per application", automode.adoc:92 "Pod Identity is the
    # recommended approach for IAM permissions in EKS Auto Mode", @edc514fac).
    - id: role
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Role
        metadata:
          name: ${schema.spec.prefix}-bifrost
          namespace: ${ns.metadata.name}
        spec:
          name: ${schema.spec.prefix}-bifrost
          description: Bifrost model gateway (Pod Identity)
          assumeRolePolicyDocument: |
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"pods.eks.amazonaws.com"},"Action":["sts:AssumeRole","sts:TagSession"],"Condition":{"StringEquals":{"aws:SourceAccount":"${schema.spec.accountID}","aws:RequestTag/eks-cluster-arn":"arn:aws:eks:${schema.spec.region}:${schema.spec.accountID}:cluster/${schema.spec.clusterName}","aws:RequestTag/kubernetes-namespace":"${ns.metadata.name}","aws:RequestTag/kubernetes-service-account":"bifrost"}}}]}
          inlinePolicies:
            bedrock: |
              {"Version":"2012-10-17","Statement":[{"Sid":"InvokeTheOneInferenceProfile","Effect":"Allow","Action":["bedrock:InvokeModel","bedrock:InvokeModelWithResponseStream"],"Resource":"arn:aws:bedrock:${schema.spec.region}:${schema.spec.accountID}:inference-profile/${schema.spec.modelID}"},{"Sid":"InvokeModelsOnlyThroughThatProfile","Effect":"Allow","Action":["bedrock:InvokeModel","bedrock:InvokeModelWithResponseStream"],"Resource":"arn:aws:bedrock:*::foundation-model/${schema.spec.foundationModelID}","Condition":{"StringEquals":{"bedrock:InferenceProfileArn":"arn:aws:bedrock:${schema.spec.region}:${schema.spec.accountID}:inference-profile/${schema.spec.modelID}"}}}]}
          tags:
            - key: ManagedBy
              value: ${schema.spec.managedBy}

    # Bifrost never calls the Kubernetes API, so no token is mounted (BPG
    # latest/bpg/security/iam.adoc:1105-1108 @edc514fac).
    - id: serviceAccount
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: bifrost
          namespace: ${ns.metadata.name}
        automountServiceAccountToken: false

    - id: podIdentity
      template:
        apiVersion: eks.services.k8s.aws/v1alpha1
        kind: PodIdentityAssociation
        metadata:
          name: ${schema.spec.prefix}-bifrost
          namespace: ${ns.metadata.name}
        spec:
          clusterName: ${schema.spec.clusterName}
          namespace: ${ns.metadata.name}
          serviceAccount: ${serviceAccount.metadata.name}
          roleARN: ${role.status.ackResourceMetadata.arn}
          tags:
            ManagedBy: ${schema.spec.managedBy}

    # Who may reach Bifrost and where it may connect, enforced by EKS Auto Mode's
    # network policy: deny by default, then named allows (BPG
    # latest/bpg/security/network.adoc:71-76, :100, :134 @edc514fac). In: agent pods on
    # 8080. Out: DNS, the Pod Identity agent, Bedrock and Postgres. Pricing is
    # local and the MCP library sync is off (values.yaml), so nothing else.
    - id: networkPolicy
      template:
        apiVersion: networking.k8s.aws/v1alpha1
        kind: ApplicationNetworkPolicy
        metadata:
          name: bifrost
          namespace: ${ns.metadata.name}
        spec:
          podSelector:
            matchLabels: { app.kubernetes.io/name: bifrost }
          policyTypes: [Ingress, Egress]
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels: { kubernetes.io/metadata.name: "${schema.spec.agentNamespace}" }
                  podSelector:
                    matchLabels: { app.kubernetes.io/name: agent }
              ports: [ { protocol: TCP, port: 8080 } ]
          egress:
            - to: [ { ipBlock: { cidr: 0.0.0.0/0 } } ]
              ports: [ { protocol: UDP, port: 53 }, { protocol: TCP, port: 53 } ]
            - to: [ { ipBlock: { cidr: 169.254.170.23/32 } } ]
              ports: [ { protocol: TCP, port: 80 } ]
            - to: [ { domainNames: [ "bedrock-runtime.${schema.spec.region}.amazonaws.com" ] } ]
              ports: [ { protocol: TCP, port: 443 } ]
            - to: [ { ipBlock: { cidr: "${schema.spec.vpcCIDR}" } } ]
              ports: [ { protocol: TCP, port: 5432 } ]

    # The model prices and parameters Bifrost reads locally (values.yaml mounts
    # it), so it never fetches them from the internet.
    - id: pricing
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: bifrost-pricing
          namespace: ${ns.metadata.name}
        data:
          pricing.json: ${schema.spec.pricingJSON}
          model-parameters.json: ${schema.spec.modelParametersJSON}

    # The agent's key, made by apply.sh once the namespace is there. Read only;
    # agentKeyCopy waits for it.
    - id: agentKey
      externalRef:
        apiVersion: v1
        kind: Secret
        metadata:
          name: bifrost-agent-key
          namespace: ${ns.metadata.name}

    # The same key in the agent's namespace, for the agent to read
    # (kro/run-rgd.yaml mounts it). kro reads a Secret's data as bytes and does not
    # put bytes in a template, so the copy encodes them back to base64, as kro's
    # error asks (pkg/cel/conversion/conversions.go:105 at v0.10.0: "encode it
    # explicitly, e.g. base64.encode(...)").
    - id: agentKeyCopy
      template:
        apiVersion: v1
        kind: Secret
        metadata:
          name: bifrost-agent-key
          namespace: ${schema.spec.agentNamespace}
        data:
          key: ${base64.encode(agentKey.data.key)}
