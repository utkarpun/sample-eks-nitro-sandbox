# This cluster's BifrostBackend (the graph in rgd.yaml). apply.sh fills each
# <...> value from the cluster and the sample's .env (common.sh render), and the
# two pricing values from bifrost/pricing/ as JSON strings, and applies the
# result. Cluster scoped: the instance makes the namespace. namespace, prefix and
# managedBy match bootstrap/'s scope (lib.sh).
apiVersion: kro.run/v1alpha1
kind: BifrostBackend
metadata:
  name: bifrost
spec:
  namespace: <BIFROST_NAMESPACE>
  prefix: bfx
  managedBy: bfx
  clusterName: <CLUSTER_NAME>
  accountID: "<ACCOUNT_ID>"
  region: <AWS_REGION>
  vpcID: <VPC_ID>
  vpcCIDR: <VPC_CIDR>
  subnetIDs: [<SUBNET_IDS>]
  agentNamespace: <NAMESPACE>
  modelID: <BEDROCK_MODEL_ID>
  foundationModelID: <FOUNDATION_MODEL_ID>
  pricingJSON: <PRICING_JSON>
  modelParametersJSON: <MODEL_PARAMETERS_JSON>
