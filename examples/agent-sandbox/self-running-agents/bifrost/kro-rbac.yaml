# What kro may manage for the bifrost-backend graph, when kro runs with
# rbac.mode aggregation: the ACK kinds the graph composes, the plain Kubernetes
# objects and the instance kind itself. Aggregated into kro's controller
# ClusterRole by the label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kro-bifrost-backend
  labels:
    rbac.kro.run/aggregate-to-controller: "true"
rules:
  - apiGroups: [ec2.services.k8s.aws]
    resources: [securitygroups]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rds.services.k8s.aws]
    resources: [dbinstances, dbsubnetgroups]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [iam.services.k8s.aws]
    resources: [roles]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [eks.services.k8s.aws]
    resources: [podidentityassociations]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.aws]
    resources: [applicationnetworkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kro.run]
    resources: [bifrostbackends, bifrostbackends/status, bifrostbackends/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
