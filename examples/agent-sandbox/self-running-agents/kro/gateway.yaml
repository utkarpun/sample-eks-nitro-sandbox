# The one SraGateway instance, applied after the SraBase instance is ACTIVE, the
# tool zip is uploaded and the agent image is pushed. Placeholders are filled by
# the wrapper: <ACCOUNT_ID>, <AWS_REGION>, <CLUSTER_NAME> and <BEDROCK_MODEL_ID>
# by render() (scripts/common.sh); "<FOUNDATION_MODEL_ARNS>" by the same sed
# setup.sh:212 uses, from bedrock get-inference-profile (a read); <TOOL_CODE_KEY>
# and <TOOL_CODE_SHA256> from the zip it uploaded (the key, and
# `openssl dgst -sha256 -binary <zip> | base64`).
apiVersion: kro.run/v1alpha1
kind: SraGateway
metadata:
  name: sra
spec:
  prefix: sra
  namespace: sra
  accountID: "<ACCOUNT_ID>"
  region: <AWS_REGION>
  clusterName: <CLUSTER_NAME>
  inferenceProfileARN: arn:aws:bedrock:<AWS_REGION>:<ACCOUNT_ID>:inference-profile/<BEDROCK_MODEL_ID>
  foundationModelARNs: ["<FOUNDATION_MODEL_ARNS>"]
  toolCodeKey: <TOOL_CODE_KEY>
  toolCodeSHA256: "<TOOL_CODE_SHA256>"
  # The text of agent/prompt.txt.
  prompt: >-
    You are a short-lived agent run. Use the gateway's clock tool to read the
    current time in UTC, then reply with one line of the form "time-in-utc: <the
    time the tool returned>". Do not guess the time.
