# Where an agent pod may connect, enforced by EKS Auto Mode's network policy.
# Selecting the pods isolates them: anything not listed is refused, ingress
# included, except the sandbox's own metadata service at 169.254.169.254, which
# runs inside the sandbox where this rule does not reach. Name rules match the addresses the names resolve to, not the name
# the client sends inside TLS, and Auto Mode learns them per node, so read this
# as "these names and anything sharing their addresses on this node".
apiVersion: networking.k8s.aws/v1alpha1
kind: ApplicationNetworkPolicy
metadata:
  name: agent-egress
  namespace: <NAMESPACE>
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: agent } }
  policyTypes: [Ingress, Egress]
  egress:
    - to: [ { ipBlock: { cidr: 0.0.0.0/0 } } ]
      ports: [ { protocol: UDP, port: 53 }, { protocol: TCP, port: 53 } ]
    # The EKS Pod Identity agent on the node, where the pod's credentials come from.
    - to: [ { ipBlock: { cidr: 169.254.170.23/32 } } ]
      ports: [ { protocol: TCP, port: 80 } ]
    - to: [ { domainNames: [ "bedrock-runtime.<AWS_REGION>.amazonaws.com", "<GATEWAY_HOST>", "<RUN_BUCKET>.s3.<AWS_REGION>.amazonaws.com" ] } ]
      ports: [ { protocol: TCP, port: 443 } ]
