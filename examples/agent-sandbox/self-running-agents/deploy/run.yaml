# One agent run, as an SraRun instance (kro/run-rgd.yaml), whose one child is the
# run's Job. Rendered by scripts/run.sh, which deletes the instance after the run;
# never delete the Job alone (kro makes it again).
apiVersion: kro.run/v1alpha1
kind: SraRun
metadata:
  name: <JOB_NAME>
  namespace: <NAMESPACE>
  labels: { self-running-agents/run: "<RUN_ID>" }
spec:
  runID: "<RUN_ID>"
  mode: "<RUN_MODE>"
  probeCalls: "<PROBE_CALLS>"
  egressCanary: "<EGRESS_CANARY>"
  image: "<IMAGE>"
  runBucket: "<RUN_BUCKET>"
  region: "<AWS_REGION>"
  bifrostNamespace: "<BIFROST_NAMESPACE>"
  modelID: "<BEDROCK_MODEL_ID>"
