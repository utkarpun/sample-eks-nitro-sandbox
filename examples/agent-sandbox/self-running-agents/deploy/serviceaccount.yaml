# The agent's identity. EKS Pod Identity maps it to the agent's IAM role, which
# is all the pod can use: the one model profile, the one gateway and puts under
# runs/ in the run bucket. No Kubernetes API token is mounted (deploy/admission.yaml);
# the only token is Pod Identity's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: <NAMESPACE>
automountServiceAccountToken: false
